<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Hub | Online</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .container { border: 1px solid #30363d; padding: 40px; border-radius: 10px; background: #161b22; box-shadow: 0 8px 24px rgba(0,0,0,0.8); text-align: left; width: 80%; max-width: 600px; position: relative; }
        .header { color: #58a6ff; font-weight: bold; border-bottom: 1px solid #30363d; margin-bottom: 20px; padding-bottom: 10px; display: flex; justify-content: space-between; }
        .terminal-text { line-height: 1.6; }
        .cursor { display: inline-block; width: 10px; height: 18px; background-color: #238636; animation: blink 1s infinite; vertical-align: middle; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        .btn { display: inline-block; margin-top: 30px; padding: 10px 20px; background-color: #238636; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; transition: 0.3s; opacity: 0; }
        .btn.visible { opacity: 1; }
        .btn:hover { background-color: #2ea043; box-shadow: 0 0 10px #238636; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span>TERMINAL V1.0.4</span>
            <span style="color: #f85149;">● ONLINE</span>
        </div>
        <div class="terminal-text" id="typewriter"></div>
        <a href="https://github.com/honestgee" class="btn" id="github-btn">ACCESS DATABASE</a>
    </div>

    <script>
        const textElement = document.getElementById('typewriter');
        const btn = document.getElementById('github-btn');
        const lines = [
            "> INITIALIZING SYSTEM...",
            "> LOADING CORE MODULES...",
            "> PYTHON SCRIPTS: ACTIVE (monitor.py)",
            "> GITHUB PAGES: CONNECTED",
            "> STATUS: SYSTEM OPERATIONAL",
            "> WELCOME, HONESTGEE."
        ];

        let lineIndex = 0;
        let charIndex = 0;

        function type() {
            if (lineIndex < lines.length) {
                if (charIndex < lines[lineIndex].length) {
                    if (charIndex === 0) {
                        const newLine = document.createElement('div');
                        newLine.style.color = lines[lineIndex].includes('OPERATIONAL') ? '#238636' : '#c9d1d9';
                        newLine.id = 'line-' + lineIndex;
                        textElement.appendChild(newLine);
                    }
                    document.getElementById('line-' + lineIndex).innerHTML += lines[lineIndex].charAt(charIndex);
                    charIndex++;
                    setTimeout(type, 40);
                } else {
                    lineIndex++;
                    charIndex = 0;
                    setTimeout(type, 500);
                }
            } else {
                const cursor = document.createElement('span');
                cursor.className = 'cursor';
                textElement.appendChild(cursor);
                btn.classList.add('visible');
            }
        }

        window.onload = type;
    </script>
</body>
</html>
