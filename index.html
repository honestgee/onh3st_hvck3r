<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onh3st_hvck3r | Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Open Sans', sans-serif; }
        body { background-color: #f8f9fa; display: flex; min-height: 100vh; color: #344767; }
        
        /* Sidebar Styles */
        .sidebar { width: 260px; background: white; border-right: 1px solid #e9ecef; padding: 20px; }
        .logo { font-weight: 700; color: #cb0c9f; font-size: 1.2rem; margin-bottom: 40px; text-align: center; }
        .nav-link { display: block; padding: 12px 15px; color: #67748e; text-decoration: none; border-radius: 8px; margin-bottom: 10px; font-size: 0.9rem; transition: 0.2s; }
        .nav-link.active { background: #fdf2f9; color: #cb0c9f; font-weight: 600; }

        /* Main Content */
        .main { flex: 1; padding: 30px; }
        .top-nav { display: flex; justify-content: space-between; margin-bottom: 30px; align-items: center; }
        
        /* Dashboard Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid #e9ecef; }
        .card h3 { font-size: 1.2rem; margin-top: 5px; }
        .card span { font-size: 0.8rem; color: #67748e; text-transform: uppercase; font-weight: 600; }

        /* News Section */
        .news-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .news-card { background: white; border-radius: 15px; border: 1px solid #e9ecef; overflow: hidden; }
        .news-img { height: 150px; background: linear-gradient(310deg, #7928ca, #ff0080); }
        .news-body { padding: 20px; }
        .btn { display: inline-block; padding: 8px 16px; background: #cb0c9f; color: white; text-decoration: none; border-radius: 8px; font-size: 0.8rem; margin-top: 10px; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="logo">ONH3ST_HVCK3R</div>
        <a href="#" class="nav-link active">Dashboard</a>
        <a href="news/post1.html" class="nav-link">Latest News</a>
        <a href="#" class="nav-link">Settings</a>
    </nav>
    
    <div class="main">
        <div class="top-nav">
            <h2>Welcome back, honestgee</h2>
            <div style="font-size: 0.8rem; font-weight: 600;">Status: <span style="color: #2dce89;">Online</span></div>
        </div>

        <div class="stats-grid">
            <div class="card"><span>Total News</span><h3>12</h3></div>
            <div class="card"><span>Active Users</span><h3>405</h3></div>
            <div class="card"><span>Server Load</span><h3>12%</h3></div>
        </div>

        <div class="news-grid">
            <div class="news-card">
                <div class="news-img"></div>
                <div class="news-body">
                    <span style="color: #cb0c9f; font-size: 0.7rem; font-weight: 700;">UPDATE</span>
                    <h4 style="margin: 5px 0;">Dashboard Initialized</h4>
                    <p style="font-size: 0.8rem; color: #67748e;">The new Asteria-style dashboard is now active. You can manage your news posts from here.</p>
                    <a href="news/post1.html" class="btn">View Post</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
